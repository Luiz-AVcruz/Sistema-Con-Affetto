[package]
name = "caixa-da-feira-desktop"
version = "0.1.0"
description = "Aplicativo local do Caixa da Feira"
authors = ["Caixa da Feira"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"
default-run = "caixa-da-feira-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"
